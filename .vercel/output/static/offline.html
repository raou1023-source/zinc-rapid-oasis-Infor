<!doctype html>
<html lang="ja">
  <head>

    <style>

        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;

      p.kicker {
        letter-spacing: 0.28em;

        color: #9b2d2d;

        margin: 0;
        color: #6b645c;

      }
      a {
        display: inline-flex;

        text-decoration: none;

    <main>
      <p class="kicker">OFFLINE</p>
